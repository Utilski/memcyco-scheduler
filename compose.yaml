services:
  frontend:
    image: 'node:24-alpine'
    working_dir: /app
    command: ['sh', '-c', 'npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort']
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - '5173:5173'
  backend:
    image: 'eclipse-temurin:27-jdk'
    working_dir: /app
    command: ['sh', './gradlew', '--no-daemon', 'bootRun']
    volumes:
      - ./backend/scheduler:/app
      - gradle-cache:/root/.gradle
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: '5672'
      SPRING_RABBITMQ_USERNAME: myuser
      SPRING_RABBITMQ_PASSWORD: secret
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  rabbitmq:
    image: 'rabbitmq:latest'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  frontend-node-modules:
  gradle-cache:
