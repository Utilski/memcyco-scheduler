services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scheduler_e2e
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 3s
      timeout: 3s
      retries: 40
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: testuser
      RABBITMQ_DEFAULT_PASS: testpass
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    image: eclipse-temurin:27-jdk
    working_dir: /app
    command: [sh, -c, 'cp /source/gradlew /source/build.gradle /source/settings.gradle /app/ && cp -R /source/gradle /source/src /app/ && sh ./gradlew --no-daemon bootRun']
    volumes:
      - ../backend/scheduler:/source:ro
      - backend-build:/app/build
      - backend-cache:/app/.gradle
      - gradle-cache:/root/.gradle
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: 'false'
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/scheduler_e2e
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: testuser
      SPRING_RABBITMQ_PASSWORD: testpass
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${E2E_FRONTEND_PORT:-15173},http://localhost:${E2E_FRONTEND_PORT:-15173}
    ports:
      - '${E2E_BACKEND_PORT:-18080}:8080'
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: [sh, -c, 'npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort']
    volumes:
      - ../frontend:/app:ro
      - frontend-deps:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:${E2E_BACKEND_PORT:-18080}
    ports:
      - '${E2E_FRONTEND_PORT:-15173}:5173'
volumes:
  mysql-data:
  rabbit-data:
  backend-build:
  backend-cache:
  gradle-cache:
  frontend-deps:
